name: Production smoke monitor
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: production-smoke-monitor
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke checks
        id: smoke
        continue-on-error: true
        env:
          BASE_URL: https://salespulse-dashboard-kappa.vercel.app
        run: node scripts/smoke-production.mjs
      - name: Create or update incident issue on failure
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search 'in:title "Production smoke monitor failed"' --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "Production smoke monitor failed" --body "Automated production browser checks failed. Inspect workflow run: $RUN_URL. This monitor checks availability, navigation, mobile layout, and browser errors."
          else
            gh issue comment "$existing" --body "Production smoke checks failed again: $RUN_URL"
          fi
      - name: Close incident on recovery
        if: steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search 'in:title "Production smoke monitor failed"' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Production browser smoke checks are passing again."
          fi
      - name: Fail workflow if smoke checks failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
